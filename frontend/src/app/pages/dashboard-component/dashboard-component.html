<div class="page">

  <!-- Header: Hi + Welcome back (same variable: account.holderName) -->
  <div class="header" *ngIf="account">
    <div class="hi-line">
      Hi <span class="name">{{ account.holderName }}</span>
    </div>
    <div class="welcome-back">
      Welcome back
    </div>
  </div>

  <!-- Balance Section (same variable: balance) -->
  <div class="balance-card" *ngIf="balance !== undefined">
    <div class="label">Account Balance</div>
    <div class="amount">₹ {{ balance | number: '1.2-2' }}</div>
  </div>

  <!-- Error (same variable: error) -->
  <p class="error" *ngIf="error">{{ error }}</p>

  <!-- Bigger 2x2 Grid (same methods: goTransfer/goHistory/goProfile/logout) -->
  <div class="grid">
    <button class="card-btn" type="button" (click)="goTransfer()">
      <span class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14" />
          <path d="M12 5l7 7-7 7" />
        </svg>
      </span>
      <div class="title">Transfer</div>
      <div class="subtitle">Send money securely</div>
    </button>

    <button class="card-btn" type="button" (click)="goHistory()">
      <span class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8" />
          <path d="M12 8v4l3 2" />
        </svg>
      </span>
      <div class="title">History</div>
      <div class="subtitle">View transactions</div>
    </button>

    <button class="card-btn" type="button" (click)="goRewards()">
      <span class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l2.76 5.59 6.16.9-4.46 4.35 1.05 6.13L12 17.77 6.49 18.97l1.05-6.13L3.08 8.49l6.16-.9L12 2z" />
        </svg>
      </span>
      <div class="title">Rewards</div>
      <div class="subtitle">View earned points</div>
    </button>

    <button class="card-btn" type="button" (click)="goProfile()">
      <span class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </span>
      <div class="title">Profile</div>
      <div class="subtitle">Account details</div>
    </button>

    <button class="card-btn danger" type="button" (click)="logout()">
      <span class="card-icon danger-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </span>
      <div class="title">Logout</div>
      <div class="subtitle">End your session</div>
    </button>
  </div>

</div>

<!-- Bottom Navbar -->
<app-navbar></app-navbar>
